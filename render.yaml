# Persistent Venny on Render.
# Disk at /data is what remembers members, events, raffles, bingo, and credits.
# After the first deploy, confirm the log says: Persistent database at /data/data.db

services:
  - type: web
    name: venny
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DB_PATH
        value: /data/data.db
    disk:
      name: venny-data
      mountPath: /data
      sizeGB: 1
