# Persistent Venny on Render via Postgres.
# After deploy the log must say: Persistent database: Render Postgres

services:
  - type: web
    name: venny
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: vennysbase
          property: connectionString
